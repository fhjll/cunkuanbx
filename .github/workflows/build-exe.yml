name: Build Windows EXE

# Windows 可执行程序：
#   build-win10    64 位 —— Python 3.12（Win10/11）
#   build-win7-x64 64 位 —— Python 3.8（3.8 是最后支持 Windows 7 的版本）
#   build-win7-x86 32 位 —— Python 3.8 x86（32 位 Win7）
# PyInstaller 不能交叉编译，32 位产物必须用 32 位 Python 构建，
# 因此 32 位作业通过 actions/setup-python 的 architecture: x86 安装 32 位解释器。

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "要构建的目标"
        type: choice
        default: "all"
        options:
          - all
          - win10
          - win7-x64
          - win7-x86

jobs:
  build-win10:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'win10' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name 存保审核工具 --add-data "templates;templates" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-win10-x64
          path: dist/存保审核工具.exe

  build-win7-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'win7-x64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (x64, Win7 兼容)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE (Win7 64-bit)
        run: |
          pyinstaller --onefile --windowed --name 存保审核工具_Win7_x64 --add-data "templates;templates" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-win7-x64
          path: dist/存保审核工具_Win7_x64.exe

  build-win7-x86:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'win7-x86' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (x86, 32 位)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"

      - name: Install dependencies (32-bit wheels)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Show interpreter bitness (sanity check)
        run: |
          python -c "import platform,struct;print('python:',platform.python_version(),'arch:',platform.machine(),'bits:',struct.calcsize('P')*8)"

      - name: Build EXE (Win7 32-bit)
        run: |
          pyinstaller --onefile --windowed --name 存保审核工具_Win7_x86 --add-data "templates;templates" gui.py

      - name: Verify generated EXE bitness
        run: |
          $f = "dist/存保审核工具_Win7_x86.exe"
          $fs = [IO.File]::OpenRead((Resolve-Path $f))
          $br = New-Object IO.BinaryReader($fs)
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOff = $br.ReadInt32()
          $fs.Seek($peOff + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close()
          # 0x014c = i386(32位)，0x8664 = x64
          Write-Host ("PE machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0x014c) { throw "产物不是 32 位程序！" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-win7-x86
          path: dist/存保审核工具_Win7_x86.exe

  publish-release:
    # Win7 x64 / x86 构建成功后，把 exe 打包成 zip 发布到 Release（公开下载）
    needs: [build-win7-x64, build-win7-x86]
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Win7 x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: 存保审核工具-win7-x64
          path: pkg/win7-x64

      - name: Download Win7 x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: 存保审核工具-win7-x86
          path: pkg/win7-x86

      - name: Pack zips (exe + 使用说明)
        run: |
          set -euo pipefail
          mkdir -p release
          cp "使用说明（简易版）.txt" "pkg/win7-x64/" 2>/dev/null || true
          cp "使用说明（简易版）.txt" "pkg/win7-x86/" 2>/dev/null || true
          (cd pkg/win7-x64 && zip -r "../../release/存保审核工具_Win7_x64.zip" .)
          (cd pkg/win7-x86 && zip -r "../../release/存保审核工具_Win7_x86.zip" .)
          ls -lh release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest \
              --title "存保审核工具 最新自动构建（Win7 x64 / x86）" \
              --notes "由 GitHub Actions 自动构建的 Windows 7 64 位 / 32 位可执行程序（内含模板与使用说明）。每次 push 后覆盖更新。" \
              --prerelease
          gh release upload ci-latest release/*.zip --clobber
