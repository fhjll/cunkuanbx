name: Build Linux (麒麟/统信UOS) 程序

# 银河麒麟 / 统信UOS 等国产 Linux 上使用的独立可执行程序。
# 设计要点：
#   - PyInstaller 不能跨平台/跨架构编译，必须在 Linux 上构建；
#   - 构建放在 manylinux2014 官方镜像里进行（glibc 2.17），产物对
#     麒麟 V10 各版本、统信 UOS、Debian/RHEL 系都能直接运行；
#   - 容器里的 Python 用绝对路径调用（镜像自带 /opt/python/*），不依赖 PATH；
#   - 产物先在容器内用 ASCII 名生成，回到宿主后再改名为中文；
#   - 构建失败时把最后 30 行日志以 ::error:: 注解输出（便于在 Actions 页面
#     与 API 上直接看到失败原因）。

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: "Target CPU arch"
        type: choice
        default: "x64"
        options:
          - x64
          - arm64
          - both

jobs:
  build-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'x64' || github.event.inputs.arch == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux2014 container (glibc 2.17)
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            quay.io/pypa/manylinux2014_x86_64 bash -euxc '
              PYBIN=$(ls -d /opt/python/cp3[89]-cp3[89]*/bin /opt/python/cp31[0-2]-cp31[0-2]*/bin 2>/dev/null | head -1)
              echo "使用 Python: $PYBIN"
              "$PYBIN/pip" install --upgrade pip wheel setuptools
              "$PYBIN/pip" install pyinstaller==4.10 openpyxl xlrd PyQt5==5.15.4
              "$PYBIN/pyinstaller" --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Linux构建失败 (exit $rc)::$(tail -25 build-linux.log | tr '\n' '|' | sed 's/%/%25/g;s/\r//g')"
            exit 1
          fi
          mv dist/app "dist/存保审核工具"

      - name: Compatibility info
        run: |
          ls -lh dist/
          objdump -T "dist/存保审核工具" | grep -o 'GLIBC_[0-9.]*' | sort -u | tail -3 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-x64
          path: dist/存保审核工具

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-log
          path: build-linux.log
          if-no-files-found: ignore

  build-linux-arm64:
    # 银河麒麟跑在飞腾/鲲鹏等 ARM64 平台时使用（需仓库可用 arm64 运行器）
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux2014_aarch64 container
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            quay.io/pypa/manylinux2014_aarch64 bash -euxc '
              PYBIN=$(ls -d /opt/python/cp3[89]-cp3[89]*/bin /opt/python/cp31[0-2]-cp31[0-2]*/bin 2>/dev/null | head -1)
              echo "使用 Python: $PYBIN"
              "$PYBIN/pip" install --upgrade pip wheel setuptools
              "$PYBIN/pip" install pyinstaller==4.10 openpyxl xlrd PyQt5==5.15.4
              "$PYBIN/pyinstaller" --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Linux(arm64)构建失败 (exit $rc)::$(tail -25 build-linux.log | tr '\n' '|' | sed 's/%/%25/g;s/\r//g')"
            exit 1
          fi
          mv dist/app "dist/存保审核工具"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-arm64
          path: dist/存保审核工具
