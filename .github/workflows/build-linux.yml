name: Build Linux (麒麟/统信UOS) 程序

# 银河麒麟 / 统信UOS 等国产 Linux 上使用的独立可执行程序。
# 设计要点：
#   - PyInstaller 不能跨平台/跨架构编译，必须在 Linux 上构建；
#   - 构建放在 manylinux2014 官方镜像里进行（glibc 2.17），
#     产物对麒麟 V10 各版本、统信 UOS、Debian/RHEL 系都能直接运行；
#   - 容器里只装 Python/PyQt5/PyInstaller（自带编译工具与 pip，
#     不依赖发行版 apt 源），先由宿主 runner 检出代码，再 docker run 构建；
#   - 产物先在容器内用 ASCII 名生成，回到宿主后再改名为中文，避免
#     容器内 C 区域设置下的编码问题。
#   - aarch64（飞腾/鲲鹏）版本用 arm64 运行器 + manylinux2014_aarch64，手动触发。

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: "Target CPU arch"
        type: choice
        default: "x64"
        options:
          - x64
          - arm64
          - both

jobs:
  build-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'x64' || github.event.inputs.arch == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux2014 container (glibc 2.17)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            quay.io/pypa/manylinux2014_x86_64 bash -euxc '
              PATH=/opt/python/cp38-cp38/bin:$PATH
              pip install --upgrade "pip<24" wheel setuptools
              pip install pyinstaller==4.10 openpyxl xlrd PyQt5==5.15.4
              pyinstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            '
          mv dist/app "dist/存保审核工具"

      - name: Compatibility info
        run: |
          ls -lh dist/
          objdump -T "dist/存保审核工具" | grep -o 'GLIBC_[0-9.]*' | sort -u | tail -3 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-x64
          path: dist/存保审核工具

  build-linux-arm64:
    # 银河麒麟跑在飞腾/鲲鹏等 ARM64 平台时使用（需仓库可用 arm64 运行器）
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux2014_aarch64 container
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            quay.io/pypa/manylinux2014_aarch64 bash -euxc '
              PATH=/opt/python/cp38-cp38/bin:$PATH
              pip install --upgrade "pip<24" wheel setuptools
              pip install pyinstaller==4.10 openpyxl xlrd PyQt5==5.15.4
              pyinstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            '
          mv dist/app "dist/存保审核工具"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-arm64
          path: dist/存保审核工具
