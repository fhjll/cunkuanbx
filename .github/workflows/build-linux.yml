name: Build Linux (麒麟/统信UOS) 程序

# 银河麒麟 / 统信UOS 等国产 Linux 上使用的独立可执行程序。
# 设计要点：
#   - PyInstaller 不能跨平台/跨架构编译，必须在 Linux 上构建；
#   - 构建放在 debian:bullseye 镜像里进行（glibc 2.31，覆盖麒麟 V10 SP2/SP3、
#     统信 UOS 20 等；更老的麒麟 V10 SP1 请用 build_linux.sh 在本机打包）；
#   - 用发行版自带 python3.9 + python3-dev（提供共享 libpython，PyInstaller 需要），
#     PyInstaller 6.x（不再依赖 pkg_resources）；
#   - 产物先在容器内用 ASCII 名生成，回到宿主后再改名为中文；
#   - 构建失败时把最后 30 行日志以 ::error:: 注解输出（便于在 Actions 页面
#     与 API 上直接看到失败原因）。

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: "Target CPU arch"
        type: choice
        default: "x64"
        options:
          - x64
          - arm64
          - both

jobs:
  build-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'x64' || github.event.inputs.arch == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in debian:bullseye container (glibc 2.31)
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            debian:bullseye bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-dev python3-pip binutils ca-certificates
              python3 -m pip install --upgrade pip wheel "setuptools<81"
              python3 -m pip install pyinstaller==6.11.1 openpyxl xlrd PyQt5==5.15.4
              python3 -m PyInstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              echo "::error title=Linux构建失败(exit $rc) 第${i}行::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)"
            done < <(tail -8 build-linux.log)
            exit 1
          fi
          mv dist/app "dist/存保审核工具"

      - name: Compatibility info
        run: |
          ls -lh dist/
          objdump -T "dist/存保审核工具" | grep -o 'GLIBC_[0-9.]*' | sort -u | tail -3 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-x64
          path: dist/存保审核工具

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-log
          path: build-linux.log
          if-no-files-found: ignore

  build-linux-arm64:
    # 银河麒麟跑在飞腾/鲲鹏等 ARM64 平台时使用（需仓库可用 arm64 运行器）
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in debian:bullseye (arm64) container
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            arm64v8/debian:bullseye bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-dev python3-pip binutils ca-certificates
              python3 -m pip install --upgrade pip wheel "setuptools<81"
              python3 -m pip install pyinstaller==6.11.1 openpyxl xlrd PyQt5==5.15.4
              python3 -m PyInstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" gui.py
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              echo "::error title=Linux(arm64)构建失败(exit $rc) 第${i}行::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)"
            done < <(tail -8 build-linux.log)
            exit 1
          fi
          mv dist/app "dist/存保审核工具"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-arm64
          path: dist/存保审核工具
