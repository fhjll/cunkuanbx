name: Build Linux (麒麟/统信UOS) 程序

# 银河麒麟 / 统信UOS 等国产 Linux 上使用的独立可执行程序（手动构建）。
# 说明：
#   - 主用的"银河麒麟 V10 x86_64"版本已在 build-exe.yml 的
#     build-kylin-v10-x64 作业中自动构建并随 Release 发布（glibc 2.28）；
#   - 本工作流仅作补充：需要单独构建 x64 / arm64 时可手动触发；
#   - 构建放在 python:3.8-buster（glibc 2.28，麒麟 V10 基线）官方完整镜像里，
#     该镜像自带共享版 libpython 与 binutils（objdump），PyInstaller 两者都要；
#   - 构建失败时把最后 8 行日志以 ::error:: 注解输出，便于排查。

permissions:
  contents: write        # 失败时把构建日志推到 ci-log-<run> 分支便于排查

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target CPU arch"
        type: choice
        default: "x64"
        options:
          - x64
          - arm64
          - both

jobs:
  build-linux-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.arch == 'x64' || github.event.inputs.arch == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in python:3.8-buster container (glibc 2.28)
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            python:3.8-buster bash -euxc '
              # 官方 python 镜像（完整版）自带共享版 libpython 与 binutils/objdump
              # （PyInstaller 两者都需要）；Qt 分析期需要 libGL 等运行库，apt 失败不中断
              sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" \
                /etc/apt/sources.list || true
              apt-get update -o Acquire::Check-Valid-Until=false || true
              apt-get install -y --no-install-recommends binutils libgl1 libglib2.0-0 \
                libxkbcommon0 libdbus-1-3 ca-certificates || true
              objdump --version | head -1
              pip install --upgrade pip wheel "setuptools<81"
              pip install pyinstaller==6.11.1 openpyxl xlrd PyQt5==5.15.4
              pyinstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" --add-data "bg.jpeg:." gui.py
              # 产物改名在容器内完成：容器以 root 写入挂载目录，
              # 宿主机（runner 用户）无权在 dist/ 里改名
              mv dist/app "dist/存保审核工具"
              ls -l dist/
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              echo "::error title=Linux构建失败(exit $rc) 第${i}行::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)"
            done < <(tail -8 build-linux.log)
            exit 1
          fi

      - name: Compatibility info
        run: |
          ls -lh dist/
          objdump -T "dist/存保审核工具" | grep -o 'GLIBC_[0-9.]*' | sort -u | tail -3 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-x64
          path: dist/存保审核工具

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-log
          path: build-linux.log
          if-no-files-found: ignore

      - name: Publish build log to branch (on failure)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs
          { echo "== tail 200 of build-linux.log =="; tail -200 build-linux.log 2>/dev/null; } > ci-logs/build-linux.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ci-log-$GITHUB_RUN_ID"
          git add -f ci-logs/build-linux.log
          git commit -m "ci log for run $GITHUB_RUN_ID"
          git push -f origin "HEAD:ci-log-$GITHUB_RUN_ID" || echo "::warning::推送日志分支失败（token 无写权限）"


  build-linux-arm64:
    # 银河麒麟跑在飞腾/鲲鹏等 ARM64 平台时使用（需仓库可用 arm64 运行器）
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build in python:3.8-buster (arm64) container
        run: |
          set +e
          docker run --rm -v "$PWD":/src -w /src \
            -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            arm64v8/python:3.8-buster bash -euxc '
              sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" \
                /etc/apt/sources.list || true
              apt-get update -o Acquire::Check-Valid-Until=false || true
              apt-get install -y --no-install-recommends binutils libgl1 libglib2.0-0 \
                libxkbcommon0 libdbus-1-3 ca-certificates || true
              pip install --upgrade pip wheel "setuptools<81"
              pip install pyinstaller==6.11.1 openpyxl xlrd PyQt5==5.15.4
              pyinstaller --onefile --noconfirm --name app \
                --add-data "templates:templates" --add-data "bg.jpeg:." gui.py
            ' 2>&1 | tee build-linux.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            i=0
            while IFS= read -r line; do
              i=$((i+1))
              echo "::error title=Linux(arm64)构建失败(exit $rc) 第${i}行::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-900)"
            done < <(tail -8 build-linux.log)
            exit 1
          fi
          mv dist/app "dist/存保审核工具"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 存保审核工具-linux-arm64
          path: dist/存保审核工具
